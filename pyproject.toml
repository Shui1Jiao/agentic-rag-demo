[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-demo"
version = "0.1.0"
description = "Agentic-RAG demo built with LangGraph: the agent decides whether to retrieve, call a tool, or answer directly"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Shui1Jiao" },
]
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "python-dotenv>=1.0.0",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
